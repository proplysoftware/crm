# AI code review with PR-Agent (https://github.com/The-PR-Agent/pr-agent), using OpenAI GPT-6.2 Sol.
# Needs the OPENAI_KEY repository secret. Review instructions live in .pr_agent.toml.
name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: PR Agent
        uses: docker://pragent/pr-agent:0.50.0-github_action
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          config.model: "openai/gpt-6.2-sol"
          config.fallback_models: "[]"
          # GPT-6.2 Sol is newer than PR-Agent 0.50 and its bundled LiteLLM, so use the explicit openai/ prefix
          # and set limits and reasoning by hand.
          # 200k input stays under OpenAI's 272k long-context price tier.
          config.custom_model_max_tokens: "200000"
          config.max_model_tokens: "200000"
          config.reasoning_effort: "medium"
          config.additional_reasoning_effort_models: '["openai/gpt-6.2-sol"]'

          github_action_config.auto_describe: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "true"
